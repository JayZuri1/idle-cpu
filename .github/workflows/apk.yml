name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir www
          echo '<p>Loading...</p>' > www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6
          npx cap init "Idle Server" com.idle.server --web-dir www
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.server={url:'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          sed -i 's#</activity>#<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="com.idle.server"/></intent-filter></activity>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: idle-server-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

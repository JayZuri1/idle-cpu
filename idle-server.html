<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idle Server</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9efec;--panel:#fff;--ink:#12302c;--mute:#5d7a75;--line:#c9d8d3;--cu:#b4691f;--cool:#138f86;--hot:#d93a1f;--ok:#2f8f4e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a18;--panel:#12292580;--ink:#e6f1ee;--mute:#8fb0aa;--line:#24443f;--cu:#e39a54;--cool:#5ad1c8;--hot:#ff6a4a;--ok:#6fd08c}}
:root[data-theme="dark"]{--bg:#0b1a18;--panel:#122925;--ink:#e6f1ee;--mute:#8fb0aa;--line:#24443f;--cu:#e39a54;--cool:#5ad1c8;--hot:#ff6a4a;--ok:#6fd08c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cash{font-size:2rem;font-weight:800}.rate{color:var(--mute);font-size:.9rem}
.die{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.chip{width:110px;height:110px;border-radius:10px;border:3px solid var(--cu);position:relative;display:grid;place-items:center;
background:repeating-linear-gradient(90deg,transparent 0 9px,color-mix(in srgb,var(--cu) 35%,transparent) 9px 10px),var(--bg);transition:box-shadow .4s}
.chip b{font-size:1.5rem}.chip small{display:block;color:var(--mute);text-align:center;font-size:.7rem}
.chip.warm{box-shadow:0 0 16px var(--cu)}.chip.hot{box-shadow:0 0 26px var(--hot);animation:p .5s infinite alternate;border-color:var(--hot)}
@keyframes p{to{box-shadow:0 0 6px var(--hot)}}
@media (prefers-reduced-motion:reduce){.chip.hot{animation:none}}
.bars{display:grid;gap:9px}
.bar label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mute)}
.track{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.fill{height:100%;width:0;background:var(--cool);transition:width .3s,background .3s}
.status{min-height:1.5em;font-size:.85rem;margin:0 0 8px;font-weight:600}
.row{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.act{flex:1;padding:12px;border-radius:10px;border:1px solid var(--cu);background:var(--cu);color:#fff;font-weight:600}
.act.alt{background:transparent;color:var(--cu)}
.act:active{transform:scale(.98)}
h2{font-size:1rem;margin:18px 0 8px}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.up .n{font-weight:600}.up .d{grid-column:1;color:var(--mute);font-size:.8rem}
.up button{grid-row:1/3;grid-column:2;padding:9px 12px;border-radius:9px;border:1px solid var(--cool);background:transparent;color:var(--cool);font-weight:600;min-width:92px}
.up button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.fine{color:var(--mute);font-size:.75rem;margin-top:16px;text-align:center}
.rack{background:#0a0f0e;border:2px solid #2b3835;border-radius:10px;padding:10px 16px;margin:0 0 10px;display:grid;gap:5px;box-shadow:inset 0 0 30px #000;position:relative}
.rack:before,.rack:after{content:"";position:absolute;top:8px;bottom:8px;width:5px;background:repeating-linear-gradient(#2b3835 0 6px,transparent 6px 14px)}
.rack:before{left:3px}.rack:after{right:3px}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;height:38px;padding:0 10px;background:linear-gradient(#26302e,#1a2220);border:1px solid #3a4845;border-radius:3px}
.bays{display:flex;gap:3px}
.bay{width:12px;height:20px;background:#0c1211;border:1px solid #3f4e4a;border-radius:1px}
.bay.on{background:#1a3a35;box-shadow:inset 0 -6px #2fd0c0}
.id{display:flex;align-items:center;gap:6px;color:#9fb8b2;font-size:.75rem}
.led{width:7px;height:7px;border-radius:50%;background:#2f8f4e;box-shadow:0 0 5px #2fd05e}
.led.ac{background:#e39a54;box-shadow:0 0 5px #e39a54;animation:blink calc(.12s + (1 - var(--load,0))*.9s) steps(2) infinite}
.unit:nth-child(2n) .led.ac{animation-delay:-.2s}.unit:nth-child(3n) .led.ac{animation-delay:-.45s}
@keyframes blink{50%{opacity:.15}}
.fans{display:flex;gap:6px}
.fan{width:24px;height:24px;border-radius:50%;border:2px solid #3f4e4a;background:conic-gradient(#6a8680 0 25%,#0c1211 0 50%,#6a8680 0 75%,#0c1211 0);animation:spin var(--fan,1.6s) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rack.warm .led.pw{background:#e39a54;box-shadow:0 0 5px #e39a54}
.rack.hot .unit{border-color:#ff6a4a;box-shadow:0 0 8px #ff6a4a88}
.rack.hot .led.pw{background:#ff4a2a;box-shadow:0 0 6px #ff4a2a;animation:blink .3s steps(2) infinite}
.rack.full .bay.on{background:#4a1f18;box-shadow:inset 0 -6px #ff6a4a}
.unit.cool{height:26px;grid-template-columns:auto 1fr;color:#7fd8d0;font-size:.72rem;background:#10302d}
.pipe{height:6px;border-radius:3px;background:linear-gradient(90deg,#2fd0c0,#0e5b54);opacity:calc(.3 + var(--p,0)*.12)}
@media (prefers-reduced-motion:reduce){.fan,.led.ac,.rack.hot .led.pw{animation:none}}
.chip{border-color:var(--tc,var(--cu))}
.rack{outline:1px solid var(--tc,#2b3835);outline-offset:-1px}
.led.ac{background:var(--tc,#e39a54);box-shadow:0 0 5px var(--tc,#e39a54)}
.unit.sw,.unit.psu{height:26px;grid-template-columns:auto 1fr;font-size:.72rem;color:#9fb8b2}
.ports{display:flex;gap:3px;flex-wrap:wrap}.port{width:9px;height:9px;background:#0c1211;border:1px solid #3f4e4a;border-radius:1px}.port.on{background:var(--tc,#2fd0c0)}
.pwb{height:6px;background:#0c1211;border-radius:3px;overflow:hidden}.pwb i{display:block;height:100%;background:#e3c354;width:0}.rack.brown .pwb i{background:#ff6a4a}
.mini{width:46px;height:6px;background:#0c1211;border-radius:3px;overflow:hidden}.mini i{display:block;height:100%;width:0;background:var(--tc,#2fd0c0)}
.net{height:14px;position:relative;overflow:hidden;margin:0 0 6px;border-radius:7px;background:var(--panel);border:1px solid var(--line)}
.net i{position:absolute;top:3px;width:6px;height:6px;border-radius:50%;background:var(--tc,var(--cu));left:-8px;animation:pk var(--pk,2s) linear infinite}
@keyframes pk{to{left:100%}}
.net.ddos i{background:var(--hot)}
.ev{display:none;padding:8px 10px;border-radius:8px;margin-bottom:8px;font-weight:600;font-size:.85rem;background:var(--hot);color:#fff}.ev.spike{background:var(--cool)}
@media (prefers-reduced-motion:reduce){.net i{animation:none}}
.mk{font-size:.7rem;font-weight:400;margin-left:6px;color:var(--mute);white-space:nowrap}.mk.hi{color:var(--hot)}.mk.lo{color:var(--ok)}
.mkt{font-size:.82rem;color:var(--mute);margin:-4px 0 8px}
.up button.sale{background:var(--cool);color:#fff}
.up{position:relative}
.unit.new{animation:slidein .7s ease-out}
@keyframes slidein{from{transform:translateX(-40px);opacity:0;box-shadow:0 0 16px var(--tc,#2fd0c0)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--cool);color:#fff;padding:8px 16px;border-radius:20px;font-weight:600;font-size:.9rem;z-index:9;box-shadow:0 4px 16px #0006;pointer-events:none;white-space:nowrap;animation:toast 1.6s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-16px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
:root:root:root{--bg:#050b0a;--panel:#0b1715;--ink:#d8f5ec;--mute:#6f9a90;--line:#1b3f38;--cu:#e39a54;--cool:#3ee6a0;--hot:#ff5a3c;--ok:#3ee6a0;color-scheme:dark}
body{background-color:#050b0a;background-image:linear-gradient(rgba(62,230,160,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(62,230,160,.06) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
main{padding:10px 12px 24px}
.top{display:flex;gap:8px;align-items:center}.chipsel{flex:1;display:grid;line-height:1.25}
#tn{font-weight:800;letter-spacing:.1em;font-size:.78rem;text-transform:uppercase}#tn::after{content:' \25be';color:var(--mute)}
.chipsel small{color:var(--mute);font-size:.6rem;letter-spacing:.1em}.chipsel small b{color:var(--ink);font-size:.8rem}
#mig{padding:5px 8px;border-radius:7px;border:1px solid var(--cu);background:transparent;color:var(--cu);font-size:.68rem;font-weight:700}
#mig::before{content:'Migrate ';opacity:.7}#mig:disabled{opacity:.35}
.cashbox{border:1.5px solid var(--cool);background:rgba(62,230,160,.12);border-radius:8px;padding:3px 10px;text-align:right;line-height:1.15}
#cash{font-size:1.2rem;color:var(--cool)}.cashbox small{display:block;font-size:.58rem;color:var(--mute)}
#snd{flex:none;padding:6px 8px;font-size:.65rem}
.bill{margin:10px auto 2px;border:1.5px solid var(--cool);border-radius:20px;padding:4px 14px;width:max-content;font-size:.72rem;letter-spacing:.08em;background:rgba(62,230,160,.08);color:var(--cool)}
.nc{text-align:center;font-size:.68rem;letter-spacing:.14em;color:var(--mute);margin-bottom:6px}
.board{display:grid;grid-template-columns:76px 1fr 76px;gap:8px}
.col{display:grid;gap:8px;align-content:stretch}.col.r{grid-template-rows:1.5fr 1fr}
.pn{border:1px dashed rgba(62,230,160,.3);border-radius:8px;padding:7px;background:rgba(5,15,13,.65);display:grid;gap:5px;align-content:start;font-size:.6rem;color:var(--mute);color:var(--tc,#3ee6a0)}
.pn h4{margin:0;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}.pn b{font-size:.72rem;color:var(--ink)}.pn span{color:var(--mute)}
.pn .track{height:5px}
.wv{width:100%;height:24px;color:var(--tc,#3ee6a0)}#wp{animation:wv var(--ws,2s) linear infinite}@keyframes wv{to{transform:translateX(-70px)}}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.cells i{height:8px;background:rgba(62,230,160,.12);border-radius:1px}
.cells i.l{background:var(--tc,#3ee6a0);box-shadow:0 0 4px var(--tc,#3ee6a0)}.cells i.l.bad{background:var(--hot);box-shadow:0 0 4px var(--hot)}
.fans{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.fans .fan{width:30px;height:30px}
.ports{display:flex;flex-wrap:wrap;gap:3px}.pt{width:9px;height:9px;border:1px solid #2a5a51;border-radius:1px}.pt.on{background:var(--tc,#3ee6a0);box-shadow:0 0 4px var(--tc,#3ee6a0)}
.frame{border:1.5px solid var(--tc,#3ee6a0);border-radius:8px;padding:8px;background:rgba(5,15,13,.75);box-shadow:inset 0 0 22px rgba(62,230,160,.08),0 0 10px color-mix(in srgb,var(--tc,#3ee6a0) 25%,transparent)}
.frame.warm{box-shadow:0 0 16px var(--cu)}.frame.hot{border-color:var(--hot);animation:p .5s infinite alternate}.frame.ddos{border-style:dashed}
.fh{display:flex;justify-content:space-between;align-items:center;font-size:.62rem;letter-spacing:.1em;color:var(--mute);margin-bottom:6px}.fh b{color:var(--ink)}
#nodes i{display:inline-block;width:7px;height:7px;margin-left:3px;border-radius:2px;background:var(--tc,#3ee6a0);animation:blink 1.2s steps(2) infinite}#nodes i:nth-child(2n){animation-delay:-.4s}#nodes i:nth-child(3n){animation-delay:-.8s}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.core{aspect-ratio:1;border:1px solid rgba(62,230,160,.18);border-radius:5px;background:rgba(62,230,160,.03);position:relative;display:grid;place-items:center}
.core.on{border-color:var(--tc,#3ee6a0);background:linear-gradient(145deg,color-mix(in srgb,var(--tc,#3ee6a0) 28%,transparent),color-mix(in srgb,var(--tc,#3ee6a0) 6%,transparent))}
.core.on::before{content:"";position:absolute;inset:6px 6px 9px;border:1px solid color-mix(in srgb,var(--tc,#3ee6a0) 45%,transparent);background:repeating-linear-gradient(0deg,transparent 0 5px,color-mix(in srgb,var(--tc,#3ee6a0) 25%,transparent) 5px 6px)}
.core i{position:absolute;left:5px;bottom:3px;height:3px;border-radius:2px;background:var(--tc,#3ee6a0);width:0;max-width:calc(100% - 10px)}
.core.add{border-style:dashed;color:var(--mute);font-size:1.1rem}
.core.new{animation:corein .6s ease-out}@keyframes corein{from{transform:scale(.4);filter:brightness(3)}}
.core em{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.55rem;color:var(--cool);white-space:nowrap;animation:fade 1.8s forwards}@keyframes fade{70%{opacity:1}to{opacity:0}}
.frame.hot .core.on{border-color:var(--hot);animation:blink .5s steps(2) infinite}
.conv{margin-top:8px}.conv label{display:flex;justify-content:space-between;font-size:.6rem;letter-spacing:.1em;color:var(--mute);margin-bottom:3px}
.conv .track{height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(62,230,160,.14) 0 6px,transparent 6px 8px)}
#sB{background:repeating-linear-gradient(90deg,var(--tc,#3ee6a0) 0 6px,transparent 6px 8px);background-size:8px 100%;animation:conv .5s linear infinite}@keyframes conv{to{background-position:8px 0}}
#cv{display:block;width:100%;height:170px;margin-top:4px}
.users{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--cool);border-radius:10px;padding:8px 12px;background:rgba(5,15,13,.85);font-size:.72rem;letter-spacing:.12em;font-weight:700;margin:-4px 0 10px;color:var(--cool)}
.users .track{height:10px}.users b{font-size:1rem;color:var(--ink)}
#ups{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 12px 10px;margin:0 -12px}
.up{display:flex;flex-direction:column;gap:5px;flex:0 0 158px;scroll-snap-align:start;margin:0;background:rgba(9,22,19,.92);border-color:var(--line)}
.up .n{display:block;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.up .d{font-size:.7rem;min-height:2.6em}
.up button{width:100%;min-width:0;border:0;background:var(--cool);color:#04130e;font-weight:800;padding:9px}
.up button:disabled{background:var(--line);color:var(--mute);opacity:1}.up button.sale{background:#7df3ff;color:#04130e}
h2{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#wp,#sB,#nodes i,.core.new{animation:none}}

.acct{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:.65rem;color:var(--mute)}.acct button{flex:none;padding:6px 10px;font-size:.7rem}
</style>
</head>
<body>
<main>
 <div class="top">
  <div class="chipsel"><span id="tn"></span><small>NET INCOME <b id="rate"></b></small></div>
  <button id="mig"></button>
  <div class="cashbox"><b id="cash">$0</b><small id="demand"></small></div>
  <button id="snd" class="act alt">Sound on</button>
 </div>
 <span id="td" hidden></span>
 <div class="acct"><button id="gl" class="act alt">Sign in with Google</button><small id="gs"></small></div>
 <div class="ev" id="ev"></div>
 <div class="bill">BILLING <b id="bill"></b> /USER</div>
 <div class="nc" id="nc"></div>
 <div class="board">
  <div class="col">
   <div class="pn"><h4>Clock</h4><b id="clock"></b><svg id="wave" class="wv" viewBox="0 0 70 24"><path id="wp" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></div>
   <div class="pn"><h4>Memory</h4><div class="cells" id="ramc"></div><span id="rT"></span><div class="track"><div class="fill" id="rB"></div></div></div>
   <div class="pn"><h4>Power</h4><div class="cells" id="pwc"></div><span id="pT"></span><div class="track"><div class="fill" id="pB"></div></div></div>
  </div>
  <div>
   <div class="frame" id="frame">
    <div class="fh"><span>CHIP <b id="temp"></b></span><span id="nodes"></span></div>
    <div class="grid" id="grid"></div>
   </div>
   <div class="conv"><label>STORAGE <span id="sT"></span></label><div class="track"><div class="fill" id="sB"></div></div></div>
  </div>
  <div class="col r">
   <div class="pn"><h4>Cooling</h4><div class="fans" id="fans"></div><span id="hT"></span><div class="track"><div class="fill" id="hB"></div></div></div>
   <div class="pn"><h4>Network</h4><div class="ports" id="ports"></div><span id="nT"></span><div class="track"><div class="fill" id="nB"></div></div></div>
  </div>
 </div>
 <canvas id="cv"></canvas>
 <div class="users"><span>USERS</span><div class="track"><div class="fill" id="uB"></div></div><b id="uT"></b></div>
 <p class="status" id="status"></p>
 <div class="mkt" id="news"></div>
 <div class="row"><button class="act" id="click"></button><button class="act alt" id="purge"></button></div>
 <h2>Upgrades</h2>
 <div id="ups"></div>
 <div id="net" style="display:none"></div><div id="rack" style="display:none"></div><div class="chip" id="chip" style="display:none"></div>
 <p class="fine"><button id="reset" style="background:none;border:0;color:var(--mute);text-decoration:underline;font-size:inherit">Reset game</button></p>
</main>


<script>
const KEY='idleServerV1';
const fresh=()=>({cash:0,demand:3,temp:30,data:0,throttle:false,purgeCd:0,
 tier:0,mk:{},mkEv:30,ev:'',evT:0,nextEv:40,
 lv:{cores:0,clock:0,vms:0,ram:0,disk:0,cool:0,psu:0,net:0,fw:0,lb:0}});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(fresh(),o,{lv:Object.assign(fresh().lv,o.lv)})}}catch(e){}

const U={
 cores:{n:'CPU cores',base:50,g:1.5,max:15,d:l=>`${1+l} → ${2+l} cores · +10 user capacity each`},
 clock:{n:'Clock speed',base:80,g:1.7,max:20,d:l=>`${(2+l*.3).toFixed(1)} → ${(2.3+l*.3).toFixed(1)} GHz · +20% capacity, runs hotter`},
 vms:{n:'Cluster',base:300,g:2.2,max:12,d:l=>`${1+l} → ${2+l} VMs · +35% capacity each`},
 ram:{n:'RAM stick',base:40,g:1.45,max:40,d:l=>`${2+l*4} → ${6+l*4} GB · 8 users per GB`},
 disk:{n:'Storage drive',base:30,g:1.5,max:40,d:l=>`${20+l*40} → ${60+l*40} GB · users generate data`},
 cool:{n:'Cooling',base:100,g:2.3,max:6,d:l=>`${['Stock fan','Heatsink','Dual fans','Liquid loop','Big radiator','Chiller','Cryo'][l]} → ${['Heatsink','Dual fans','Liquid loop','Big radiator','Chiller','Cryo','Maxed'][l]}`},
 psu:{n:'Power supply',base:70,g:1.5,max:25,d:l=>`${(300+l*220)*tm()} → ${(520+l*220)*tm()} W · overdraw causes brownouts`},
 net:{n:'Network bandwidth',base:60,g:1.55,max:30,d:l=>`${(1+l)*14*tm()} → ${(2+l)*14*tm()} users of bandwidth`},
 fw:{n:'Firewall',base:150,g:1.9,max:5,d:l=>`Blocks DDoS junk · keeps ${Math.min(100,40+l*15)}% → ${Math.min(100,55+l*15)}% income in attacks`},
 lb:{n:'Load balancer',base:200,g:1.8,max:8,d:l=>`Spreads load · heat -${l*6}% → -${l*6+6}%`}
};
const cost=k=>Math.floor(U[k].base*Math.pow(U[k].g+.04,S.lv[k])*Math.pow(3,S.tier)*(S.mk[k]||1));
const L=S.lv;
const cpuCap=()=>Math.floor((1+L.cores)*10*(1+.2*L.clock)*(1+.35*L.vms)*tm()*(brown()?.6:1)*(S.throttle?.5:1));
const ramCap=()=>(2+L.ram*4)*8*tm();
const diskCap=()=>(20+L.disk*40)*tm();
const maxUsers=()=>Math.min(cpuCap(),ramCap(),netCap());
const served=()=>Math.floor(Math.min(S.demand*(S.ev==='spike'?2:S.ev==='ddos'?2:1),maxUsers()));
const load=()=>Math.min(1,served()/Math.max(1,Math.floor(cpuCap()/(S.throttle?.5:1))));
const diskFull=()=>S.data>=diskCap();
const income=()=>served()*.6*(S.throttle?.7:1)*(diskFull()?.5:1)*(S.ev==='ddos'?Math.min(1,.4+.15*L.fw):1)-powerDraw()*.002;

const $=id=>document.getElementById(id);
